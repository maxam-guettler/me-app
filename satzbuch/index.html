<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Satzbuch</title>
<!-- PWA: Manifest + Icons, damit sich die Me-App wie eine App auf den Homescreen legen lässt -->
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" href="../icons/icon-192.png">
<link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Me">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEEF0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1215" media="(prefers-color-scheme: dark)">
<style>[hidden]{display:none!important}img{max-width:100%}</style>
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: App-Shell mit Kopfzeile, scrollender Mitte und Tab-Leiste unten (Handy);
   ab 900 px breiter Inhalt mit zweispaltigen Karten (Laptop). Farben: Hantelscheiben (blau/rot/gelb). */
:root {
  --bg: #ECEEF0;
  --surface: #FFFFFF;
  --surface-2: #E2E6EA;
  --fg: #14171B;
  --muted: #5A6570;
  --line: #D0D6DC;
  --accent: #2A57C0;
  --on-accent: #FFFFFF;
  --push: #2A57C0;
  --pull: #BE3328;
  --legs: #B8840F;
  --ok: #24804F;
  --danger: #BE3328;
  --shadow: 0 1px 2px rgba(20, 30, 45, .06), 0 4px 14px rgba(20, 30, 45, .06);
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  --tabbar-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1215; --surface: #171B20; --surface-2: #20262D; --fg: #E8ECF0; --muted: #94A0AB;
    --line: #2A3239; --accent: #7298F0; --on-accent: #0F1215; --push: #7298F0; --pull: #EC6A5D;
    --legs: #E3B243; --ok: #4CC487; --danger: #EC6A5D; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1215; --surface: #171B20; --surface-2: #20262D; --fg: #E8ECF0; --muted: #94A0AB;
  --line: #2A3239; --accent: #7298F0; --on-accent: #0F1215; --push: #7298F0; --pull: #EC6A5D;
  --legs: #E3B243; --ok: #4CC487; --danger: #EC6A5D; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--fg); }
body {
  margin: 0; font-family: var(--f-body); font-size: 16px; line-height: 1.45;
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 30; background: var(--bg);
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 700; letter-spacing: .01em; margin: 0; text-wrap: balance; line-height: 1.1; }
h1 { font-size: 2rem; }
h2 { font-size: 1.5rem; }
h3 { font-size: 1.2rem; }
.label { font-size: .72rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: .875rem; }

/* ---------- Shell ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg);
  display: flex; align-items: center; gap: 12px; min-height: 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
}
.brand { font-family: var(--f-display); font-weight: 700; font-size: 1.45rem; letter-spacing: .02em; display: flex; align-items: center; gap: 8px; }
.brand svg { width: 26px; height: 26px; }
.top .spacer { flex: 1; }
/* Me-App: Zurück-Knopf zur Startseite */
.home-link { display: grid; place-items: center; width: 40px; height: 40px; margin-left: -10px; margin-right: -6px;
  border-radius: 12px; color: var(--fg); text-decoration: none; }
.home-link svg { width: 22px; height: 22px; }
.home-link:active { background: var(--surface-2); }
.sync-chip {
  display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface);
  border-radius: 999px; padding: 5px 11px; font-size: .8rem; font-weight: 600; color: var(--muted); white-space: nowrap;
}
.sync-chip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.sync-chip[data-s="ok"] .dot { background: var(--ok); }
.sync-chip[data-s="busy"] .dot { background: var(--accent); animation: pulse 1s infinite; }
.sync-chip[data-s="error"] { color: var(--danger); border-color: color-mix(in srgb, var(--danger) 45%, var(--line)); }
.sync-chip[data-s="error"] .dot { background: var(--danger); }
@keyframes pulse { 50% { opacity: .3; } }

main {
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 18px calc(var(--tabbar-h) + 96px + env(safe-area-inset-bottom, 0px));
  max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px;
}
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; display: flex; justify-content: center;
  background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px));
}
.tabs button {
  flex: 1; max-width: 200px; height: var(--tabbar-h); border: 0; background: none; display: flex; flex-direction: column;
  align-items: center; justify-content: center; gap: 3px; font-size: .75rem; font-weight: 600; color: var(--muted);
}
.tabs button svg { width: 24px; height: 24px; }
.tabs button[aria-current="page"] { color: var(--accent); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px;
  border-radius: 12px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; font-size: .95rem;
}
.btn svg { width: 18px; height: 18px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.day { background: var(--day); border-color: var(--day); color: #fff; }
:root[data-theme="dark"] .btn.day { color: #0F1215; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.day { color: #0F1215; } }
.btn.ghost { background: transparent; }
.btn.danger { color: var(--danger); }
.btn.small { min-height: 36px; padding: 0 12px; font-size: .85rem; border-radius: 10px; }
.btn:disabled { opacity: .5; cursor: default; }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }

[data-day="push"] { --day: var(--push); }
[data-day="pull"] { --day: var(--pull); }
[data-day="legs"] { --day: var(--legs); }

/* ---------- Home ---------- */
.hero-next {
  background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden;
  display: grid; grid-template-columns: 8px 1fr;
}
.hero-next .stripe { background: var(--day); }
.hero-next .body { padding: 18px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.hero-next h1 { font-size: 2.6rem; }
.hero-next .meta { display: flex; gap: 16px; flex-wrap: wrap; color: var(--muted); font-size: .9rem; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.week .d { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 8px 0; border-radius: 10px; }
.week .d.today { background: var(--surface); box-shadow: var(--shadow); }
.week .d .w { font-size: .72rem; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.week .d .pip { width: 26px; height: 26px; border-radius: 50%; border: 2px dashed var(--line); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: .8rem; color: #fff; }
.week .d .pip.done { border: 0; background: var(--day); }
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.daycard {
  text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 14px 16px;
  display: flex; flex-direction: column; gap: 6px; position: relative; overflow: hidden;
}
.daycard::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 5px; background: var(--day); }
.daycard .name { font-family: var(--f-display); font-weight: 700; font-size: 1.5rem; }
.daycard .info { display: flex; justify-content: space-between; gap: 8px; font-size: .85rem; color: var(--muted); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }

/* ---------- Workout ---------- */
.wo-head { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.wo-head .title { flex: 1; min-width: 0; }
.wo-head h1 { color: var(--day); font-size: 2.2rem; }
.progress { height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--day); width: 0; transition: width .3s; }
.warmup { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.wu-item { display: grid; grid-template-columns: 64px 1fr 44px; gap: 12px; align-items: center; }
.wu-item .thumb { width: 64px; height: 48px; border-radius: 8px; overflow: hidden; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); }
.wu-item .thumb img { width: 100%; height: 100%; object-fit: cover; }
.wu-item .thumb svg { width: 28px; height: 28px; }
.wu-item .txt { min-width: 0; }
.wu-item .txt b { display: block; }
.wu-item.done .txt b { text-decoration: line-through; color: var(--muted); }
.check {
  width: 44px; height: 44px; border-radius: 12px; border: 2px solid var(--line); background: var(--surface);
  display: grid; place-items: center; color: transparent;
}
.check svg { width: 22px; height: 22px; }
.check.on { background: var(--ok); border-color: var(--ok); color: #fff; }

.exlist { display: grid; grid-template-columns: 1fr; gap: 16px; align-items: start; }
@media (min-width: 900px) { .exlist { grid-template-columns: 1fr 1fr; } }
.ex { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; }
.ex.complete { outline: 2px solid color-mix(in srgb, var(--ok) 55%, transparent); }
.ex-top { display: grid; grid-template-columns: 112px 1fr; gap: 12px; padding: 12px; align-items: start; }
.anim { position: relative; width: 112px; aspect-ratio: 3 / 2; max-width: 100%; border-radius: 10px; overflow: hidden; background: var(--surface-2); border: 0; padding: 0; }
.anim img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.anim img.b { animation: flip 2.4s steps(1, end) infinite; }
@keyframes flip { 0% { opacity: 0; } 50% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .anim img.b { animation: none; opacity: 0; } }
.anim .zoom { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.55); color: #fff; border-radius: 6px; padding: 2px 4px; display: grid; }
.anim .zoom svg { width: 14px; height: 14px; }
.ex-name { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.ex-name h3 { font-size: 1.35rem; }
.ex-name .sub { font-size: .85rem; color: var(--muted); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { font-size: .75rem; font-weight: 600; border-radius: 999px; padding: 2px 9px; background: var(--surface-2); color: var(--muted); white-space: nowrap; }
.chip.up { background: color-mix(in srgb, var(--ok) 18%, transparent); color: var(--ok); }
.cues { margin: 0; padding: 0 12px 0 30px; font-size: .88rem; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
.cues[hidden] { display: none !important; }
.last { margin: 0 12px; padding: 8px 10px; border-radius: 10px; background: var(--surface-2); font-size: .85rem; display: flex; gap: 8px; flex-wrap: wrap; align-items: baseline; }
.last b { font-weight: 600; }
.sets { width: 100%; border-collapse: collapse; margin-top: 8px; }
.sets th { font-size: .7rem; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); text-align: left; padding: 4px 6px; }
.sets td { padding: 4px 6px; vertical-align: top; }
.sets .setno { padding-top: 12px; }
.sets td:first-child, .sets th:first-child { padding-left: 12px; width: 34px; }
.sets td:last-child, .sets th:last-child { padding-right: 12px; width: 56px; text-align: right; }
.sets .setno { font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; color: var(--muted); }
.sets tr.done .setno { color: var(--ok); }
.sets input {
  width: 100%; min-width: 0; height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg);
  padding: 0 10px; font-size: 1.05rem; font-variant-numeric: tabular-nums; font-weight: 600;
}
.sets input::placeholder { color: var(--muted); font-weight: 500; opacity: .75; }
.sets tr.done input { background: color-mix(in srgb, var(--ok) 10%, var(--surface)); border-color: color-mix(in srgb, var(--ok) 40%, var(--line)); }
.sets .total { display: block; font-size: .72rem; color: var(--muted); margin-top: 2px; }
.ex-foot { display: flex; gap: 8px; padding: 8px 12px 12px; flex-wrap: wrap; }

.finish-end { display: flex; }
.finish-end .btn.big { flex: 1; min-height: 56px; font-size: 1.1rem; border-radius: 14px; }
.finish-bar { display: flex; gap: 10px; flex-wrap: wrap; justify-content: flex-end; }
textarea { width: 100%; min-height: 70px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); padding: 10px; font-size: 16px; }

/* ---------- Rest timer ---------- */
.timer {
  position: fixed; z-index: 26; left: 50%; transform: translateX(-50%);
  bottom: calc(var(--tabbar-h) + 10px + env(safe-area-inset-bottom, 0px));
  width: min(520px, calc(100% - 24px)); background: var(--fg); color: var(--bg); border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); padding: 10px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 8px 12px; align-items: center;
}
.timer > div { min-width: 0; }
.timer .lbl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
@media (max-width: 520px) {
  .timer { grid-template-columns: auto 1fr; }
  .timer .tbtns { grid-column: 1 / -1; }
  .timer .tbtns button { flex: 1; }
}
.timer .t { font-family: var(--f-display); font-weight: 700; font-size: 2.1rem; font-variant-numeric: tabular-nums; min-width: 4ch; }
.timer .bar { height: 4px; background: color-mix(in srgb, var(--bg) 25%, transparent); border-radius: 2px; overflow: hidden; }
.timer .bar i { display: block; height: 100%; background: var(--accent); width: 100%; }
.timer .lbl { font-size: .78rem; opacity: .75; margin-bottom: 4px; }
.timer button { background: transparent; border: 1px solid color-mix(in srgb, var(--bg) 35%, transparent); color: var(--bg); border-radius: 10px; min-height: 40px; padding: 0 10px; font-weight: 600; }
.timer.done { background: var(--ok); color: #fff; }
.timer.done button { color: #fff; border-color: rgba(255,255,255,.5); }

/* ---------- Cards / forms ---------- */
.card { background: var(--surface); border-radius: var(--r); box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.grid2 { display: grid; grid-template-columns: 1fr; gap: 16px; }
@media (min-width: 900px) { .grid2 { grid-template-columns: 1fr 1fr; } }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: .85rem; font-weight: 600; }
.field input, .field select {
  height: 44px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); padding: 0 12px; font-size: 16px; width: 100%; min-width: 0;
}
.field .hint { font-size: .8rem; color: var(--muted); }
.switch { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); }
.status-line { font-size: .88rem; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.status-line.err { background: color-mix(in srgb, var(--danger) 14%, transparent); color: var(--danger); }
.status-line.ok { background: color-mix(in srgb, var(--ok) 14%, transparent); color: var(--ok); }
ol.steps { margin: 0; padding-left: 20px; font-size: .9rem; display: flex; flex-direction: column; gap: 4px; }

/* ---------- Stats ---------- */
.seg { align-self: flex-start; display: inline-flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; border-radius: 9px; padding: 7px 12px; font-weight: 600; font-size: .88rem; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--fg); box-shadow: var(--shadow); }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border-radius: var(--r); padding: 12px 14px; box-shadow: var(--shadow); }
.kpi .v { font-family: var(--f-display); font-weight: 700; font-size: 1.9rem; font-variant-numeric: tabular-nums; }
.tbl-wrap { overflow-x: auto; }
table.data { width: 100%; border-collapse: collapse; font-size: .9rem; }
table.data th { text-align: left; font-size: .7rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line); }
table.data td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; font-variant-numeric: tabular-nums; }
table.data td:first-child { font-weight: 600; }
table.data .delta-up { color: var(--ok); font-weight: 600; }
.chart svg { width: 100%; height: auto; display: block; }
.chart .grid line { stroke: var(--line); }
.chart text { fill: var(--muted); font-size: 15px; font-family: var(--f-body); }
.chart .ln { fill: none; stroke: var(--day, var(--accent)); stroke-width: 2.5; }
.chart .ar { fill: color-mix(in srgb, var(--day, var(--accent)) 14%, transparent); }
.chart .pt { fill: var(--surface); stroke: var(--day, var(--accent)); stroke-width: 2; }
.chart .pt.last { fill: var(--day, var(--accent)); }
.chart .val { fill: var(--fg); font-weight: 600; font-size: 16px; }
.hist { display: flex; flex-direction: column; gap: 8px; }
.hist details { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); }
.hist summary { list-style: none; display: grid; grid-template-columns: 6px 1fr auto; gap: 12px; padding: 10px 12px 10px 0; cursor: pointer; align-items: center; }
.hist summary::-webkit-details-marker { display: none; }
.hist summary .s { align-self: stretch; background: var(--day); border-radius: 0 4px 4px 0; }
.hist .det { padding: 0 12px 12px 18px; display: flex; flex-direction: column; gap: 8px; font-size: .9rem; }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); display: flex; flex-direction: column; gap: 12px; align-items: center; }
.demo-note { font-size: .82rem; padding: 6px 10px; border-radius: 8px; background: color-mix(in srgb, var(--legs) 18%, transparent); }

/* ---------- Plan editor ---------- */
.ped { display: grid; grid-template-columns: 1fr repeat(3, 64px) auto; gap: 6px; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--line); }
.ped input, .ped select { height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); padding: 0 6px; width: 100%; min-width: 0; font-size: 16px; }
.ped .nm { min-width: 0; }
.ped .nm b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ped .acts { display: flex; gap: 2px; }
.ped .acts button { width: 34px; height: 38px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; }
.ped .acts svg { width: 18px; height: 18px; }
@media (max-width: 520px) {
  .ped { grid-template-columns: 1fr 52px 52px 52px; }
  .ped .acts { grid-column: 1 / -1; justify-content: flex-end; }
}

/* ---------- Overlay ---------- */
.lightbox { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.82); display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px; }
.lightbox .inner { width: min(720px, 100%); display: flex; flex-direction: column; gap: 10px; color: #fff; }
.lightbox .imgs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.lightbox img { width: 100%; border-radius: 10px; }
.lightbox ul { margin: 0; padding-left: 20px; }
.toast {
  position: fixed; z-index: 45; left: 50%; transform: translateX(-50%); top: calc(env(safe-area-inset-top, 0px) + 66px);
  background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: .9rem;

const fmtDate = ts => new Date(ts).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });
const fmtDateLong = ts => new Date(ts).toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long' });
const fmtTime = ts => new Date(ts).toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
const fmtDur = ms => { const m = Math.round(ms / 60000); return m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`; };
const mmss = s => { s = Math.max(0, Math.ceil(s)); return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`; };
function weekStart(ts) { const d = new Date(ts); d.setHours(0, 0, 0, 0); const wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return d.getTime(); }

/* =========================================================
   Speicher (IndexedDB → localStorage → Arbeitsspeicher)
   ========================================================= */
const Store = (() => {
  let idb = null; const mem = {};
  async function open() {
    try {
      idb = await new Promise((res, rej) => {
        const r = indexedDB.open('satzbuch', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });
    } catch (e) { idb = null; }
    try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  }
  async function get(k) {
    if (idb) {
      try {
        const v = await new Promise((res, rej) => { const t = idb.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result); t.onerror = () => rej(t.error); });
        if (v !== undefined) return v;
      } catch (e) { }
    }
    try { const v = localStorage.getItem('satzbuch:' + k); if (v != null) return JSON.parse(v); } catch (e) { }
    return mem[k];
  }
  async function set(k, v) {
    mem[k] = v;
    if (idb) {
      try {
        await new Promise((res, rej) => { const tx = idb.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); });
        return;
      } catch (e) { }
    }
    try { localStorage.setItem('satzbuch:' + k, JSON.stringify(v)); } catch (e) { }
  }
  return { open, get, set };
})();

   settings = nur lokal (Zugangsdaten bleiben auf dem Gerät)

/* Me-App: Server, Benutzer und App-Passwort gelten für alle Module und werden auf der
   Startseite oder hier eingestellt (localStorage "meapp:nc", bleibt nur auf diesem Gerät).
   Der Dateipfad bleibt pro Modul (hier /MeApp/satzbuch.json). */
const SHARED_NC = 'meapp:nc';
function readSharedNc() { try { return JSON.parse(localStorage.getItem(SHARED_NC) || 'null'); } catch (e) { return null; } }
function writeSharedNc() {
  try { const { url, user, pass } = settings.nc; localStorage.setItem(SHARED_NC, JSON.stringify({ url, user, pass, updatedAt: Date.now() })); } catch (e) { }
}
function applySharedNc() {
  const s = readSharedNc();
  if (s && s.url) { settings.nc.url = s.url; settings.nc.user = s.user || ''; settings.nc.pass = s.pass || ''; }
  else if (settings.nc.url) writeSharedNc(); // hier schon eingerichtet → für die Startseite übernehmen
}

/* Gespeicherte Pläne auf den aktuellen Stand bringen (läuft beim Start, nach Sync und Import).
   v2: Cool-down ergänzt, Pausen zwischen Sätzen einheitlich 90 s. Gibt true zurück, wenn etwas geändert wurde. */
function migratePlan(p) {
  if (!p || !p.days || (p.version || 1) >= 2) return false;
  for (const k of DAY_KEYS) {
    const d = p.days[k]; if (!d) continue;
    if (!Array.isArray(d.cooldown)) d.cooldown = clone(COOLDOWN);
    (d.exercises || []).forEach(e => { e.rest = 90; });
  }
  p.version = 2; p.updatedAt = Date.now();
  return true;
}

/* =========================================================
   Gewichtslogik
   ========================================================= */
function barOf(ex) { return ex.mode === 'perSide' ? (ex.bar == null ? Number(settings.barWeight) || 0 : ex.bar) : 0; }
// Gesamtlast eines Satzes in kg (für Volumen, Rekorde und 1RM)
function loadOf(ex, w) {
  if (w == null) return 0;
  if (ex.mode === 'perSide') return barOf(ex) + 2 * w;
  if (ex.mode === 'perHand') return ex.single ? w : 2 * w;
  return w;
}
// Bei Kurzhanteln zählt für Rekorde das Gewicht je Hantel, sonst die Gesamtlast
function topOf(ex, w) { return ex.mode === 'perHand' ? w : loadOf(ex, w); }
const unitHint = ex => ex.mode === 'perSide' ? 'kg je Seite' : ex.mode === 'perHand' ? (ex.single ? 'kg Hantel' : 'kg je Hantel') : 'kg';
const step = ex => ex.mode === 'perSide' ? 1.25 : ex.mode === 'perHand' ? 1 : 2.5;
const e1rm = (w, r) => r > 0 ? w * (1 + r / 30) : 0; // Epley-Formel

function lastSetsFor(exId, beforeTs = Infinity) {
  const ss = sessionsDone().filter(s => s.startedAt < beforeTs && s.ex[exId] && s.ex[exId].sets.some(x => x.done));
  const s = ss[ss.length - 1];
  return s ? { ts: s.startedAt, sets: s.ex[exId].sets.filter(x => x.done) } : null;
}
const setsStr = (sets) => sets.map(x => `${fmtNum(x.w ?? 0)}×${x.r ?? 0}`).join(' · ');

function suggestion(ex, beforeTs) {
  const last = lastSetsFor(ex.id, beforeTs);
  if (last) {
    const allMax = last.sets.length >= ex.sets && last.sets.every(x => (x.r ?? 0) >= ex.repMax);
    return { src: 'last', ts: last.ts, sets: last.sets, up: allMax ? step(ex) : 0 };
  }
  if (ex.start) {
    const sets = Array.from({ length: ex.sets }, (_, i) => ({ w: ex.start.w[Math.min(i, ex.start.w.length - 1)], r: ex.start.r }));
    return { src: 'start', sets, up: 0 };
  }
  return null;
}

/* =========================================================
   Einheit (Training) starten / bearbeiten
   ========================================================= */
function startSession(dayKey) {
  if (activeSession()) { toast('Es läuft bereits ein Training.'); return; }
  const d = plan().days[dayKey];
  const s = { id: uid(), day: dayKey, startedAt: Date.now(), endedAt: null, updatedAt: Date.now(), warmup: d.warmup.map(() => false), cooldown: (d.cooldown || []).map(() => false), ex: {}, note: '' };
  for (const ex of d.exercises) {
    const sug = suggestion(ex, s.startedAt);
    s.ex[ex.id] = {
      name: ex.name,
      sets: Array.from({ length: ex.sets }, (_, i) => {
        const p = sug && sug.sets[Math.min(i, sug.sets.length - 1)];
        // Graue Platzhalter = Werte der letzten Einheit (Steigerungs-Hinweis steht nur als Chip darüber)
        return { w: null, r: null, pw: p ? p.w : null, pr: p ? p.r : ex.repMax, done: false };
      })
    };
  }
  doc.sessions[s.id] = s; touchDoc();
  ui.tab = 'train'; render(); window.scrollTo(0, 0); requestWake();
}
function updS(s) { s.updatedAt = Date.now(); touchDoc(); }

/* =========================================================
   Pausentimer
   ========================================================= */
let timer = { endAt: 0, total: 0, label: '', iv: null, rang: false };
let audioCtx = null;
document.addEventListener('pointerdown', () => { if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { } } }, { once: true });
function beep() {
  if (!settings.sound || !audioCtx) return;
  try {
    [0, .25, .5].forEach(t => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.0001, audioCtx.currentTime + t); g.gain.exponentialRampToValueAtTime(.3, audioCtx.currentTime + t + .02);
      g.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + t + .18);
      o.start(audioCtx.currentTime + t); o.stop(audioCtx.currentTime + t + .2);
    });
  } catch (e) { }
  try { navigator.vibrate && navigator.vibrate([200, 100, 200]); } catch (e) { }
}
function startTimer(sec, label) {
  timer.total = sec; timer.endAt = Date.now() + sec * 1000; timer.label = label; timer.rang = false;
  clearInterval(timer.iv); timer.iv = setInterval(tickTimer, 250); tickTimer();
}
function stopTimer() { clearInterval(timer.iv); timer.iv = null; $('#timer').hidden = true; }
function tickTimer() {
  const el = $('#timer'); const left = (timer.endAt - Date.now()) / 1000;
  el.hidden = false;
  el.classList.toggle('done', left <= 0);
  $('.t', el).textContent = left > 0 ? mmss(left) : 'Los!';
  $('.lbl', el).textContent = left > 0 ? 'Pause · ' + timer.label : 'Nächster Satz · ' + timer.label;
  $('.bar i', el).style.width = Math.max(0, Math.min(100, left / timer.total * 100)) + '%';
  if (left <= 0 && !timer.rang) { timer.rang = true; beep(); }
  if (left < -20) stopTimer();
}

/* Display wach halten während des Trainings */
let wakeLock = null;
async function requestWake() {
  if (!settings.wakeLock || !activeSession() || document.visibilityState !== 'visible') return;
  try { if ('wakeLock' in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) { }
}
function releaseWake() { try { wakeLock && wakeLock.release(); } catch (e) { } wakeLock = null; }

/* =========================================================
   Nextcloud-Sync (WebDAV)
   Ablauf: GET → zusammenführen → (falls nötig) PUT mit If-Match
   Zusammenführen: pro Einheit gewinnt der neueste Stand (updatedAt),
   Löschungen bleiben als Markierung erhalten; Plan als Ganzes.
   ========================================================= */
let sync = { status: 'off', msg: '', busy: false, again: false, t: null };
const syncConfigured = () => !!(settings.nc.url && settings.nc.user && settings.nc.pass && settings.nc.path);

function mergeDocs(a, b) {
  const out = { schema: 1, plan: a.plan, sessions: {} };
  if (b.plan && (b.plan.updatedAt || 0) > (a.plan.updatedAt || 0)) out.plan = b.plan;
  const ids = new Set([...Object.keys(a.sessions || {}), ...Object.keys(b.sessions || {})]);
  for (const id of ids) {
    const x = a.sessions?.[id], y = b.sessions?.[id];
    out.sessions[id] = !x ? y : !y ? x : ((y.updatedAt || 0) > (x.updatedAt || 0) ? y : x);
  }
  return out;
}
function davUrls() {
  let base = settings.nc.url.trim().replace(/\/+$/, '').replace(/\/index\.php.*$/, '');
  if (!/^https?:\/\//i.test(base)) base = 'https://' + base;
  const root = base + '/remote.php/dav/files/' + encodeURIComponent(settings.nc.user.trim());
  const segs = settings.nc.path.split('/').filter(Boolean).map(encodeURIComponent);
  return { file: root + '/' + segs.join('/'), dirs: segs.slice(0, -1).map((_, i) => root + '/' + segs.slice(0, i + 1).join('/')) };
}
const authH = () => 'Basic ' + btoa(unescape(encodeURIComponent(settings.nc.user.trim() + ':' + settings.nc.pass)));
// ETag ohne Kompressions-Zusatz: W/"abc-gzip" → "abc"
function normEtag(e) {
  if (!e) return null;
  return e.trim().replace(/^W\//, '').replace(/[-;](gzip|br|deflate)"$/i, '"');
}
function httpErr(r) { const e = new Error('HTTP ' + r.status); e.status = r.status; return e; }
function explainSyncErr(e) {
  if (e.status === 401) return 'Anmeldung abgelehnt: Benutzername oder App-Passwort prüfen.';
  if (e.status === 403) return 'Zugriff verweigert (403). Hat das App-Passwort Schreibrechte?';
  if (e.status === 404) return 'Pfad nicht gefunden (404). Server-Adresse prüfen.';
  if (e.status === 412) return 'Datei wurde gleichzeitig geändert. Bitte erneut synchronisieren.';
  if (e.status === 507) return 'Nextcloud-Speicher ist voll.';
  if (e.name === 'SyntaxError') return 'Die Datei in der Nextcloud ist kein gültiges Satzbuch-JSON. Sie wird nicht überschrieben.';
  if (e instanceof TypeError) return navigator.onLine === false
    ? 'Offline. Die Daten sind lokal gespeichert und werden später übertragen.'
    : 'Server nicht erreichbar oder vom Browser blockiert (CORS). Ist WebAppPassword installiert und diese Adresse als erlaubter Ursprung eingetragen?';
  return 'Fehler: ' + (e.message || e);
}
function setSync(status, msg = '') { sync.status = status; sync.msg = msg; renderSyncChip(); if (ui.tab === 'settings') renderSyncStatus(); }
function scheduleSync(ms) {
  if (!syncConfigured() || !settings.nc.auto) return;
  clearTimeout(sync.t); sync.t = setTimeout(() => syncNow(), ms);
}
async function syncNow() {
  if (!syncConfigured()) { setSync('off'); return false; }
  if (sync.busy) { sync.again = true; return false; }
  sync.busy = true; setSync('busy');
  let ok = false;
  try {
    for (let attempt = 0; attempt < 3 && !ok; attempt++) {
      const { file, dirs } = davUrls();
      const r = await fetch(file, { method: 'GET', headers: { Authorization: authH() }, cache: 'no-store' });
      let remote = null, etag = null, exists = false;
      if (r.status === 404) exists = false;
      else if (r.ok) {
        exists = true; etag = normEtag(r.headers.get('ETag'));
        const txt = await r.text();
        if (txt.trim()) { remote = JSON.parse(txt); if (!remote || typeof remote !== 'object' || !remote.sessions) throw Object.assign(new Error('bad'), { name: 'SyntaxError' }); }
      } else throw httpErr(r);

      const merged = remote ? mergeDocs(doc, remote) : doc;
      migratePlan(merged.plan); // falls ein älteres Gerät einen alten Plan hochgeladen hat
      if (JSON.stringify(merged) !== JSON.stringify(doc)) {
        doc = merged; await Store.set('doc', doc);
        if (!activeSession() || ui.tab !== 'train') render();
      }
      if (!remote || JSON.stringify(merged) !== JSON.stringify(remote)) {
        const h = { Authorization: authH(), 'Content-Type': 'application/json' };
        // letzter Versuch ohne If-Match: Daten sind oben bereits zusammengeführt, es geht nichts verloren
        if (etag && attempt < 2) h['If-Match'] = etag; else if (!exists) h['If-None-Match'] = '*';
        const body = JSON.stringify(merged);
        let p = await fetch(file, { method: 'PUT', headers: h, body });
        if (p.status === 409 || p.status === 404) { // Ordner fehlt → anlegen
          for (const d of dirs) { await fetch(d, { method: 'MKCOL', headers: { Authorization: authH() } }); }
          p = await fetch(file, { method: 'PUT', headers: h, body });
        }
        if (p.status === 412) continue; // jemand anderes hat zwischendurch geschrieben → neu laden
        if (!p.ok) throw httpErr(p);
      }
      ok = true;
    }
    if (!ok) throw httpErr({ status: 412 });
    settings.lastSync = Date.now(); saveSettings(); setSync('ok');
  } catch (e) {
    setSync('error', explainSyncErr(e));
  } finally {
    sync.busy = false;
    if (sync.again) { sync.again = false; setTimeout(syncNow, 500); }
  }
  return ok;
}

/* =========================================================
   Rendering
   ========================================================= */
function render() {
  $$('.tabs button').forEach(b => b.setAttribute('aria-current', b.dataset.tab === ui.tab ? 'page' : 'false'));
  const v = $('#view');
  if (ui.tab === 'train') v.innerHTML = activeSession() ? viewWorkout() : viewHome();
  else if (ui.tab === 'stats') v.innerHTML = viewStats();
  else if (ui.tab === 'plan') v.innerHTML = viewPlan();
  else v.innerHTML = viewSettings();
  if (ui.tab === 'train' && activeSession()) refreshProgress();
  renderSyncChip();
}
function renderSyncChip() {
  const c = $('#syncChip');
  const map = { off: 'Nur lokal', busy: 'Synchronisiere…', ok: 'Synchron' + (settings.lastSync ? ' · ' + fmtTime(settings.lastSync) : ''), error: 'Sync-Fehler' };
  c.dataset.s = syncConfigured() ? sync.status : 'off';
  c.innerHTML = `<span class="dot"></span>${esc(syncConfigured() ? map[sync.status] || 'Bereit' : 'Nur lokal')}`;
  c.title = sync.msg || '';
}

/* ---------- Start / Übersicht ---------- */
function nextDay() {
  const done = sessionsDone(); if (!done.length) return 'push';
  return DAY_KEYS[(DAY_KEYS.indexOf(done[done.length - 1].day) + 1) % 3];
}
function estMinutes(d) {
  // 45 s je Satz + Pausen zwischen den Sätzen + Gerätewechsel nach jeder Übung
  const chg = Number(settings.changeRest) || 120;
  const sec = d.exercises.reduce((a, e) => a + e.sets * 45 + Math.max(0, e.sets - 1) * e.rest + chg, 0);
  return Math.round(sec / 60 + 7 + ((d.cooldown || []).length ? COOLDOWN_MIN : 0));
}
function viewHome() {
  const nd = nextDay(), d = plan().days[nd], done = sessionsDone();
  const ws = weekStart(Date.now());
  const week = WD.map((w, i) => {
    const t0 = ws + i * DAY_MS, s = done.filter(x => x.startedAt >= t0 && x.startedAt < t0 + DAY_MS);
    const today = Date.now() >= t0 && Date.now() < t0 + DAY_MS;
    const sd = s[0]?.day;
    return `<div class="d ${today ? 'today' : ''}" ${sd ? `data-day="${sd}"` : ''}><span class="w">${w}</span><span class="pip ${sd ? 'done' : ''}">${sd ? esc(plan().days[sd].name[0]) : ''}</span></div>`;
  }).join('');
  const lastOf = k => { const s = done.filter(x => x.day === k).pop(); return s ? fmtDate(s.startedAt) : 'noch nie'; };
  const thisWeek = done.filter(x => x.startedAt >= ws).length;
  return `
  <section class="hero-next" data-day="${nd}">
    <div class="stripe"></div>
    <div class="body">
      <span class="label">Als Nächstes dran</span>
      <h1>${esc(d.name)} Day</h1>
      <div class="meta"><span>${esc(d.focus)}</span><span class="num">${d.exercises.length} Übungen · ${d.exercises.reduce((a, e) => a + e.sets, 0)} Sätze</span><span class="num">ca. ${estMinutes(d)} min</span></div>
      <div class="row"><button class="btn day" data-act="start" data-day="${nd}">${ICON.train} ${esc(d.name)} starten</button></div>
    </div>
  </section>
  <section class="card">
    <div class="section-head"><h2>Diese Woche</h2><span class="muted small num">${thisWeek} ${thisWeek === 1 ? 'Einheit' : 'Einheiten'}</span></div>
    <div class="week">${week}</div>
  </section>
  <section style="display:flex;flex-direction:column;gap:10px">
    <div class="section-head"><h2>Anderen Tag wählen</h2></div>
    <div class="days">${DAY_KEYS.map(k => {
      const x = plan().days[k];
      return `<button class="daycard" data-day="${k}" data-act="start">
        <span class="name">${esc(x.name)}</span><span class="small muted">${esc(x.focus)}</span>
        <span class="info num"><span>Zuletzt: ${lastOf(k)}</span><span>ca. ${estMinutes(x)} min</span></span></button>`;
    }).join('')}</div>
  </section>`;
}

/* ---------- Laufendes Training ---------- */
function viewWorkout() {
  const s = activeSession(), d = plan().days[s.day];
  const exIds = Object.keys(s.ex);
  if (!Array.isArray(s.cooldown)) s.cooldown = (d.cooldown || []).map(() => false); // Einheiten von vor dem Update
  // Warm-up und Cool-down nutzen dieselbe Abhak-Liste (kind = 'wu' bzw. 'cd')
  const routine = (list, state, kind) => list.map((w, i) => `
    <div class="wu-item ${state[i] ? 'done' : ''}">
      <button class="thumb anim-sm" data-act="${kind}info" data-i="${i}" aria-label="${esc(w.name)} ansehen" style="border:0;padding:0">${w.img ? `<img src="${imgSrc(w.img, 0)}" alt="" loading="lazy">` : ICON.stretch}</button>
      <div class="txt"><b>${esc(w.name)}</b><span class="small muted">${esc(w.dose)} · ${esc(w.cue)}</span></div>
      <button class="check ${state[i] ? 'on' : ''}" data-act="${kind}" data-i="${i}" aria-label="Erledigt">${ICON.check}</button>
    </div>`).join('');
  const wu = routine(d.warmup, s.warmup, 'wu');
  const cdList = d.cooldown || [];
  return `
  <section class="wo-head" data-day="${s.day}">
    <div class="title">
      <span class="label num" id="woClock">${fmtDateLong(s.startedAt)} · seit ${fmtTime(s.startedAt)}</span>

  <div class="progress" data-day="${s.day}"><i id="woProg"></i></div>

    ${wu}
  </section>
  <section class="exlist" data-day="${s.day}">
    ${exIds.map(id => exCard(s, id)).join('')}
  </section>
  ${cdList.length ? `<section class="warmup" data-day="${s.day}">
    <div class="section-head"><h2>Cool-down</h2><span class="small muted">ca. ${COOLDOWN_MIN} min</span></div>
    ${routine(cdList, s.cooldown, 'cd')}
  </section>` : ''}
  <section class="card">
    <label class="label" for="woNote">Notiz zur Einheit</label>
    <textarea id="woNote" data-act="note" placeholder="z. B. Schulter links etwas gezwickt, Gym sehr voll …">${esc(s.note)}</textarea>
  </section>
  <section class="finish-end" data-day="${s.day}">
    <button class="btn day big" data-act="finishAsk">${ICON.check} Training abschließen</button>
  </section>
  <div id="finishBox"></div>`;
}
function exCard(s, id) {

    ? `<div class="last"><span class="label">${sug.src === 'last' ? 'Letztes Mal · ' + fmtDate(sug.ts) : 'Startwerte aus deiner Notiz'}</span><b class="num">${esc(setsStr(sug.sets))}</b>${sug.up ? `<span class="chip up">Ziel geschafft → +${fmtNum(sug.up)} kg</span>` : ''}</div>`

  <article class="ex ${allDone ? 'complete' : ''}" id="ex-${esc(id)}">

      </div>

}
function setRow(ex, id, x, i) {

function refreshProgress() {
  const s = activeSession(); if (!s) return;
  const all = Object.values(s.ex).flatMap(e => e.sets), done = all.filter(x => x.done).length;
  const cd = s.cooldown || [];
  const wu = s.warmup.filter(Boolean).length + cd.filter(Boolean).length;
  const p = (done + wu) / Math.max(1, all.length + s.warmup.length + cd.length);
  const el = $('#woProg'); if (el) el.style.width = (p * 100).toFixed(1) + '%';
  const clock = $('#woClock'); if (clock) clock.textContent = `${fmtDateLong(s.startedAt)} · ${fmtDur(Date.now() - s.startedAt)} · ${done}/${all.length} Sätze`;
}
function replaceCard(id) {
  const s = activeSession(); const old = $('#ex-' + CSS.escape(id)); if (!old || !s) return;
  const tmp = document.createElement('div'); tmp.innerHTML = exCard(s, id); old.replaceWith(tmp.firstElementChild);
}
function summaryOf(s) {
  let sets = 0, vol = 0; const prs = [];
  for (const [id, e] of Object.entries(s.ex)) {
    const ex = findEx(id) || { mode: 'total' };
    const dn = e.sets.filter(x => x.done && x.w != null && x.r);
    sets += dn.length; vol += dn.reduce((a, x) => a + loadOf(ex, x.w) * x.r, 0);
    if (dn.length) {
      const best = Math.max(...dn.map(x => topOf(ex, x.w)));
      const prev = sessionsDone().filter(o => o.id !== s.id && o.startedAt < s.startedAt && o.ex[id]).flatMap(o => o.ex[id].sets.filter(x => x.done && x.w != null).map(x => topOf(ex, x.w)));
      if (prev.length && best > Math.max(...prev)) prs.push(`${e.name}: ${fmtKg(best)}`);
    }
  }
  return { sets, vol, prs };
}

/* ---------- Monitor / Statistik ---------- */
function makeDemo() {
  // Beispielverlauf nur zur Ansicht – wird NICHT gespeichert oder synchronisiert
  const out = []; const now = Date.now();
  for (let w = 7; w >= 0; w--) {
    DAY_KEYS.forEach((k, j) => {
      const t = weekStart(now) - w * 7 * DAY_MS + (j * 2) * DAY_MS + 18 * 36e5;
      if (t > now) return;
      const s = { id: 'demo' + w + k, day: k, startedAt: t, endedAt: t + 70 * 6e4, ex: {}, warmup: [], note: '' };
      for (const ex of plan().days[k].exercises) {
        const base = ex.start ? ex.start.w[ex.start.w.length - 1] : (ex.mode === 'perHand' ? 10 : ex.mode === 'perSide' ? 10 : 30);
        const w0 = base * (0.8 + 0.035 * (7 - w));
        s.ex[ex.id] = { name: ex.name, sets: Array.from({ length: ex.sets }, (_, i) => ({ w: Math.round((w0 + i * step(ex) * 0.5) / step(ex)) * step(ex), r: ex.repMax - (i % 3), done: true })) };
      }
      out.push(s);
    });
  }
  return out;
}
function statsSessions() { return ui.demo ? makeDemo() : sessionsDone(); }
function seriesFor(exId, sess) {
  const ex = findEx(exId) || { mode: 'total' };
  return sess.filter(s => s.ex[exId] && s.ex[exId].sets.some(x => x.done && x.w != null)).map(s => {
    const dn = s.ex[exId].sets.filter(x => x.done && x.w != null);
    return {
      ts: s.startedAt,
      top: Math.max(...dn.map(x => topOf(ex, x.w))),
      vol: dn.reduce((a, x) => a + loadOf(ex, x.w) * (x.r || 0), 0),
      orm: Math.max(...dn.map(x => e1rm(loadOf(ex, x.w), x.r || 0)))
    };
  });
}
function chartSvg(pts, key, unit) {
  if (pts.length < 1) return '<div class="empty small">Für diese Übung gibt es noch keine Einträge.</div>';
  const W = 480, H = 250, L = 46, R = 14, T = 28, B = 30;
  const ys = pts.map(p => p[key]);
  let lo = Math.min(...ys), hi = Math.max(...ys);
  if (lo === hi) { lo -= 5; hi += 5; }
  const pad = (hi - lo) * 0.12; lo = Math.max(0, lo - pad); hi += pad;
  // runde Tick-Abstände
  const raw = (hi - lo) / 4, mag = Math.pow(10, Math.floor(Math.log10(raw))), stepT = [1, 2, 2.5, 5, 10].map(m => m * mag).find(m => m >= raw);
  lo = Math.floor(lo / stepT) * stepT; hi = Math.ceil(hi / stepT) * stepT;
  const t0 = pts[0].ts, t1 = pts[pts.length - 1].ts, span = Math.max(1, t1 - t0);
  const x = ts => pts.length === 1 ? (L + (W - L - R) / 2) : L + (ts - t0) / span * (W - L - R);
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const ticks = []; for (let v = lo; v <= hi + 1e-9; v += stepT) ticks.push(v);
  const line = pts.map((p, i) => `${i ? 'L' : 'M'}${x(p.ts).toFixed(1)},${y(p[key]).toFixed(1)}`).join('');
  const area = pts.length > 1 ? `${line}L${x(t1).toFixed(1)},${y(lo)}L${x(t0).toFixed(1)},${y(lo)}Z` : '';
  const nx = Math.min(pts.length, 5); const xl = [];
  for (let i = 0; i < nx; i++) { const p = pts[Math.round(i * (pts.length - 1) / Math.max(1, nx - 1))]; xl.push(p); }
  const last = pts[pts.length - 1];
  const lx = x(last.ts), anchor = lx > W - 70 ? 'end' : 'middle';
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf">
    <g class="grid">${ticks.map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`).join('')}</g>
    ${ticks.map(v => `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${fmtNum(v)}</text>`).join('')}
    ${[...new Set(xl)].map(p => `<text x="${x(p.ts)}" y="${H - 8}" text-anchor="middle">${new Date(p.ts).toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit' })}</text>`).join('')}
    ${area ? `<path class="ar" d="${area}"/>` : ''}
    <path class="ln" d="${line}"/>
    ${pts.map((p, i) => `<circle class="pt ${i === pts.length - 1 ? 'last' : ''}" cx="${x(p.ts)}" cy="${y(p[key])}" r="${i === pts.length - 1 ? 5 : 3.5}"><title>${fmtDate(p.ts)}: ${fmtNum(p[key])} ${unit}</title></circle>`).join('')}
    <text class="val" x="${lx}" y="${y(last[key]) - 12}" text-anchor="${anchor}">${fmtNum(last[key])} ${unit}</text>
  </svg>`;
}
function viewStats() {
  const sess = statsSessions();

  const inRange = (a, b) => sess.filter(s => s.startedAt >= a && s.startedAt < b);
  const month = sess.filter(s => s.startedAt >= now - 30 * DAY_MS);
  const volWeek = inRange(ws, ws + 7 * DAY_MS).reduce((a, s) => a + summaryVol(s), 0);
  let streak = 0; for (let w = ws; ; w -= 7 * DAY_MS) { if (sess.some(s => s.startedAt >= w && s.startedAt < w + 7 * DAY_MS)) streak++; else if (w === ws) continue; else break; if (streak > 200) break; }
  const setsOf = (s, id) => s && s.ex[id] ? s.ex[id].sets.filter(x => x.done) : [];
  const lastIn = (a, b, id) => inRange(a, b).filter(s => s.ex[id] && s.ex[id].sets.some(x => x.done)).pop();
  const cell = (st, s) => st.length ? `<b>${fmtNum(Math.max(...st.map(x => x.w ?? 0)))} kg</b><span class="reps">Wdh. ${st.map(x => x.r ?? 0).join(' / ')}</span><span class="reps">${fmtDate(s.startedAt)}</span>` : '<span class="muted">–</span>';

      <div class="det">${Object.entries(s.ex).filter(([, e]) => e.sets.some(x => x.done)).map(([, e]) => `<div><b>${esc(e.name)}</b> <span class="num muted">${esc(setsStr(e.sets.filter(x => x.done)))}</span></div>`).join('') || '<span class="muted">Keine Sätze erfasst.</span>'}

      ${ui.demo ? '' : `<div class="confirm" id="del-${s.id}"><button class="btn small danger" data-act="delAsk" data-id="${s.id}">${ICON.trash} Einheit löschen</button></div>`}</div></details>`;
  }).join('');
  return `
  <section class="section-head"><h1>Monitor</h1>${ui.demo ? '<button class="btn small" data-act="demo">Beispiel ausblenden</button>' : ''}</section>

    <div class="kpi"><div class="label">Letzte 30 Tage</div><div class="v">${month.length}</div><div class="small muted">Einheiten</div></div>
    <div class="kpi"><div class="label">Volumen Woche</div><div class="v">${fmtNum(Math.round(volWeek / 100) / 10)} t</div><div class="small muted">Σ kg × Wdh.</div></div>

  <div class="seg" role="group" aria-label="Trainingstag">${DAY_KEYS.map(k => `<button data-act="statsDay" data-day="${k}" aria-pressed="${ui.statsDay === k}">${esc(plan().days[k].name)}</button>`).join('')}</div>

    case 'wu': { s.warmup[+b.dataset.i] = !s.warmup[+b.dataset.i]; updS(s); const it = b.closest('.wu-item'); it.classList.toggle('done', s.warmup[+b.dataset.i]); b.classList.toggle('on', s.warmup[+b.dataset.i]); refreshProgress(); break; }
    case 'wuinfo': { const w = plan().days[s.day].warmup[+b.dataset.i]; lightbox(w.name, w.img, [w.dose, w.cue]); break; }
    case 'cd': { const i = +b.dataset.i; s.cooldown[i] = !s.cooldown[i]; updS(s); const it = b.closest('.wu-item'); it.classList.toggle('done', s.cooldown[i]); b.classList.toggle('on', s.cooldown[i]); refreshProgress(); break; }
    case 'cdinfo': { const w = (plan().days[s.day].cooldown || [])[+b.dataset.i]; if (w) lightbox(w.name, w.img, [w.dose, w.cue]); break; }
    case 'zoom': { const ex = findEx(b.dataset.ex); lightbox(ex.name, ex.img, ex.cues || []); break; }
    case 'done': {
      const tr = b.closest('tr'), id = tr.dataset.ex, i = +tr.dataset.i, x = s.ex[id].sets[i], ex = findEx(id) || { rest: 90, name: s.ex[id].name, mode: 'total' };
      if (!x.done) { // leere Felder mit Vorschlag füllen
        if (x.w == null && x.pw != null) x.w = x.pw;
        if (x.r == null && x.pr != null) x.r = x.pr;
        if (x.w == null || x.r == null) { toast('Bitte Gewicht und Wiederholungen eintragen.'); $(`#${x.w == null ? 'w' : 'r'}-${CSS.escape(id)}-${i}`)?.focus(); break; }
        x.done = true;
        // Vorschlag für den nächsten Satz = dieser Satz
        const nx = s.ex[id].sets[i + 1]; if (nx && !nx.done && nx.w == null) { nx.pw = nx.pw ?? x.w; }
        if (settings.autoRest) {
          if (s.ex[id].sets.every(y => y.done)) { // letzter Satz der Übung → Gerätewechsel (Standard 2 min)
            const ids = Object.keys(s.ex), nextId = ids.slice(ids.indexOf(id) + 1).concat(ids.slice(0, ids.indexOf(id))).find(k => s.ex[k].sets.some(y => !y.done));
            const nm = nextId ? (findEx(nextId)?.name || s.ex[nextId].name) : 'Cool-down';
            startTimer(Number(settings.changeRest) || 120, 'Wechsel → ' + nm);
          } else startTimer(ex.rest || 90, ex.name); // zwischen den Sätzen (Standard 1,5 min)
        }
      } else x.done = false;
      updS(s); replaceCard(id); refreshProgress();
      break;
    }
    case 'addset': { const e2 = s.ex[b.dataset.ex], lst = e2.sets[e2.sets.length - 1]; e2.sets.push({ w: null, r: null, pw: lst ? (lst.w ?? lst.pw) : null, pr: lst ? (lst.r ?? lst.pr) : null, done: false }); updS(s); replaceCard(b.dataset.ex); refreshProgress(); break; }
    case 'delset': { const e2 = s.ex[b.dataset.ex]; e2.sets.pop(); updS(s); replaceCard(b.dataset.ex); refreshProgress(); break; }
    case 'rest': { const ex = findEx(b.dataset.ex); startTimer(ex?.rest || 90, ex?.name || ''); break; }
    case 'tplus': timer.endAt += 15000; timer.total += 15; tickTimer(); break;
    case 'tminus': timer.endAt -= 15000; tickTimer(); break;
    case 'tskip': stopTimer(); break;
    case 'finishAsk': {
      const sm = summaryOf(s), open = Object.values(s.ex).flatMap(x => x.sets).filter(x => !x.done).length;
      $('#finishBox').innerHTML = `<section class="card" data-day="${s.day}"><h2>Training beenden?</h2>
        <div class="small num">${sm.sets} Sätze erledigt${open ? `, ${open} offen (werden nicht gezählt)` : ''} · ${fmtKg(Math.round(sm.vol))} Volumen · ${fmtDur(Date.now() - s.startedAt)}</div>
        ${sm.prs.length ? `<div class="small"><b>Neue Bestwerte:</b> ${esc(sm.prs.join(', '))}</div>` : ''}
        <div class="finish-bar"><button class="btn danger ghost" data-act="discard">Verwerfen</button><button class="btn ghost" data-act="finishCancel">Weiter trainieren</button><button class="btn day" data-act="finish">Speichern</button></div></section>`;
      $('#finishBox').scrollIntoView({ behavior: 'smooth', block: 'end' });
      break;
    }
    case 'finishCancel': $('#finishBox').innerHTML = ''; break;
    case 'finish': {
      const sm = summaryOf(s);
      s.endedAt = Date.now(); updS(s); stopTimer(); releaseWake(); scheduleSync(300);
      toast(sm.prs.length ? `Gespeichert · ${sm.prs.length} neue${sm.prs.length > 1 ? '' : 'r'} Bestwert${sm.prs.length > 1 ? 'e' : ''}!` : 'Training gespeichert.');
      ui.tab = 'stats'; ui.statsDay = s.day; render(); window.scrollTo(0, 0); break;
    }
    case 'discard': s.deleted = true; updS(s); stopTimer(); releaseWake(); toast('Training verworfen.'); render(); break;
    case 'statsDay': ui.statsDay = b.dataset.day; ui.statsEx = null; render(); break;
    case 'statsMetric': ui.statsMetric = b.dataset.m; render(); break;
    case 'demo': ui.demo = !ui.demo; render(); break;
    case 'delAsk': $('#del-' + b.dataset.id).innerHTML = `<span>Wirklich löschen?</span><button class="btn small danger" data-act="delYes" data-id="${b.dataset.id}">Löschen</button><button class="btn small ghost" data-act="demoNoop">Abbrechen</button>`; break;
    case 'delYes': { const x = doc.sessions[b.dataset.id]; if (x) { x.deleted = true; updS(x); toast('Einheit gelöscht.'); render(); } break; }
    case 'demoNoop': render(); break;
    case 'planDay': ui.planDay = b.dataset.day; render(); break;
    case 'pmove': { const arr = plan().days[ui.planDay].exercises, i = +b.closest('.ped').dataset.i, j = i + +b.dataset.dir; if (j < 0 || j >= arr.length) break; [arr[i], arr[j]] = [arr[j], arr[i]]; planChanged(); render(); break; }
    case 'pdel': { const row = b.closest('.ped'), i = +row.dataset.i; const nm = plan().days[ui.planDay].exercises[i].name; row.querySelector('.acts').innerHTML = `<button data-act="pdelYes" aria-label="${esc(nm)} wirklich entfernen" style="width:auto;color:var(--danger);font-weight:600;padding:0 6px">Entfernen?</button>`; break; }
    case 'pdelYes': { const i = +b.closest('.ped').dataset.i; plan().days[ui.planDay].exercises.splice(i, 1); planChanged(); render(); toast('Übung entfernt. Der Verlauf bleibt erhalten.'); break; }
    case 'padd': {
      const nm = $('#newName').value.trim(); if (!nm) { toast('Bitte einen Namen eingeben.'); $('#newName').focus(); break; }
      const mode = $('#newMode').value;
      plan().days[ui.planDay].exercises.push({ id: 'x_' + uid(), name: nm, sub: '', img: null, sets: 3, repMin: 10, repMax: 12, rest: 90, mode, bar: null, cues: [] });
      planChanged(); render(); toast(nm + ' hinzugefügt.'); break;
    }
    case 'preset': $('#resetBox').innerHTML = `<div class="confirm"><span>Eigene Änderungen am Plan gehen verloren, der Verlauf bleibt.</span><button class="btn small danger" data-act="presetYes">Zurücksetzen</button></div>`; break;
    case 'presetYes': doc.plan = clone(DEFAULT_PLAN); planChanged(); render(); toast('Plan zurückgesetzt.'); break;
    case 'syncNow': saveNcFields(); syncNow().then(ok => toast(ok ? 'Synchronisiert.' : 'Sync fehlgeschlagen.')); break;
    case 'export': exportData(); break;
    case 'copyOut': { // Daten als Text anzeigen + in die Zwischenablage kopieren
      const txt = JSON.stringify(doc);
      $('#xferBox').innerHTML = `<div class="field"><label for="xferTxt">Alle Daten als Text</label><textarea id="xferTxt" readonly rows="4">${esc(txt)}</textarea><span class="hint">Falls das Kopieren nicht automatisch klappt: ins Feld tippen, alles markieren, kopieren.</span></div>`;
      const ta = $('#xferTxt'); ta.focus(); ta.select();
      (navigator.clipboard?.writeText(txt) || Promise.reject()).then(() => toast('In die Zwischenablage kopiert.'))
        .catch(() => { try { document.execCommand('copy') ? toast('In die Zwischenablage kopiert.') : null; } catch (e) { } });
      break;
    }
    case 'pasteIn':
      $('#xferBox').innerHTML = `<div class="field"><label for="xferIn">Kopierten Text hier einfügen</label><textarea id="xferIn" rows="4" placeholder='{"schema":1, …}'></textarea></div><div class="row"><button class="btn primary" data-act="pasteGo">Einspielen</button></div>`;
      $('#xferIn').focus(); break;
    case 'pasteGo': importText($('#xferIn').value).then(ok => { if (ok) $('#xferBox').innerHTML = ''; }); break;
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.f) { // Satz-Eingabe
    const s = activeSession(); const tr = t.closest('tr'); if (!s || !tr) return;
    const x = s.ex[tr.dataset.ex].sets[+tr.dataset.i];
    x[t.dataset.f] = t.dataset.f === 'r' ? (parseNum(t.value) == null ? null : Math.round(parseNum(t.value))) : parseNum(t.value);
    if (t.dataset.f === 'w') { const ex = findEx(tr.dataset.ex); const tot = $('[data-tot]', tr); if (tot && ex) tot.textContent = x.w != null ? '= ' + fmtKg(loadOf(ex, x.w)) + (ex.mode === 'perHand' && !ex.single ? ' gesamt' : '') : ''; }
    updS(s); return;
  }
  if (t.id === 'woNote') { const s = activeSession(); if (s) { s.note = t.value; updS(s); } return; }
  if (t.dataset.pf) { const i = +t.closest('.ped').dataset.i, ex = plan().days[ui.planDay].exercises[i], v = Math.round(parseNum(t.value) || 0); if (v > 0) { ex[t.dataset.pf] = v; if (t.dataset.pf === 'repMax' && ex.repMin > v) ex.repMin = v; if (t.dataset.pf === 'repMax') ex.repMin = Math.min(ex.repMin, v); planChanged(); } return; }
  if (t.dataset.set === 'barWeight') { const v = parseNum(t.value); if (v != null) { settings.barWeight = v; saveSettings(); } return; }
  if (t.dataset.set === 'changeRest') { const v = Math.round(parseNum(t.value) || 0); if (v >= 15 && v <= 600) { settings.changeRest = v; saveSettings(); } return; }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'statsEx') { ui.statsEx = t.value; render(); return; }
  if (t.dataset.set && t.type === 'checkbox') { settings[t.dataset.set] = t.checked; saveSettings(); return; }
  if (t.dataset.s) { saveNcFields(); return; }
  if (t.dataset.pf) { render(); return; }
  if (t.id === 'importFile' && t.files[0]) importData(t.files[0]);
});
document.addEventListener('keydown', e => { // Enter springt zum nächsten Feld
  if (e.key === 'Enter' && e.target.dataset && e.target.dataset.f) {
    e.preventDefault(); const ins = $$('.sets input'); const i = ins.indexOf(e.target); if (ins[i + 1]) ins[i + 1].focus(); else e.target.blur();
  }
  if (e.key === 'Escape') $('.lightbox')?.remove();
});
function saveNcFields() {
  const g = id => $('#' + id);
  if (!g('ncUrl')) return;
  settings.nc.url = g('ncUrl').value.trim(); settings.nc.user = g('ncUser').value.trim(); settings.nc.pass = g('ncPass').value;
  settings.nc.path = g('ncPath').value.trim() || '/MeApp/satzbuch.json';
  if (!settings.nc.path.startsWith('/')) settings.nc.path = '/' + settings.nc.path;
  settings.nc.auto = g('ncAuto').checked;
  saveSettings(); writeSharedNc(); renderSyncChip(); renderSyncStatus();
}
function exportData() {
  const blob = new Blob([JSON.stringify(doc, null, 1)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `satzbuch-${new Date().toISOString().slice(0, 10)}.json`; document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
}
async function importData(file) { return importText(await file.text()); }
// Zusammenführen statt Überschreiben: vorhandene Einheiten bleiben erhalten
async function importText(txt) {
  try {
    const d = JSON.parse(String(txt || '').trim());
    if (!d || !d.sessions || !d.plan) throw new Error('Kein Satzbuch-Export');
    doc = mergeDocs(doc, d); migratePlan(doc.plan); await Store.set('doc', doc); scheduleSync(300); render(); toast('Daten eingespielt.');
    return true;
  } catch (err) { toast('Konnte nicht gelesen werden: ' + err.message); return false; }
}

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible') { applySharedNc(); requestWake(); if (activeSession() && timer.iv) tickTimer(); scheduleSync(500); }
  else { clearTimeout(saveTimer); Store.set('doc', doc); }
});
window.addEventListener('online', () => scheduleSync(500));
setInterval(() => { refreshProgress(); }, 30000);
setInterval(() => { if (document.visibilityState === 'visible') scheduleSync(0); }, 5 * 60000);

/* =========================================================
   Start
   ========================================================= */
(async function boot() {
  await Store.open();
  const sd = await Store.get('doc'); if (sd && sd.sessions && sd.plan) doc = sd;
  if (migratePlan(doc.plan)) await Store.set('doc', doc);
  const st = await Store.get('settings'); if (st) settings = { ...settings, ...st, nc: { ...settings.nc, ...(st.nc || {}) } };
  applySharedNc();
  const s = activeSession(); if (s) ui.tab = 'train';
  $('.brand').insertAdjacentHTML('afterbegin', ICON.logo);
  $$('.tabs button').forEach(b => b.insertAdjacentHTML('afterbegin', ICON[b.dataset.icon]));
  render(); requestWake();
  if (syncConfigured()) syncNow();
  // Offline-Modus: gemeinsamer Service Worker der Me-App (liegt eine Ebene höher)
  if ('serviceWorker' in navigator && window.isSecureContext && window.top === window.self && document.querySelector('link[rel="manifest"]')) {
    try { navigator.serviceWorker.register('../sw.js', { scope: '../' }); } catch (e) { }
  }
})();

</script>
</body>
</html>
